name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - "**"
    tags-ignore:
      - "*"

env:
  BUILD_DIR: build-ci
  BUILD_TYPE: Release

permissions:
  contents: read

jobs:
  build-test:
    name: Build and test Linux
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache libsmbclient-dev

      - name: Install Conan
        run: |
          python -m pip install --upgrade pip
          python -m pip install "conan==2.24.0"
          conan profile detect --force

      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ~/.conan2
          key: conan-${{ runner.os }}-${{ hashFiles('conanfile.txt') }}
          restore-keys: |
            conan-${{ runner.os }}-

      - name: Cache C++ compilation
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: linux-implant-${{ hashFiles('conanfile.txt') }}
          max-size: 500MB

      - name: Configure CI tests
        run: |
          cmake \
            -S . \
            -B "$BUILD_DIR" \
            -DCMAKE_BUILD_TYPE="$BUILD_TYPE" \
            -DC2CORE_BUILD_TESTS=ON \
            -DC2CORE_BUILD_FUNCTIONAL_TESTS=OFF \
            -DCMAKE_PROJECT_TOP_LEVEL_INCLUDES="$GITHUB_WORKSPACE/conan_provider.cmake" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build "$BUILD_DIR" --config "$BUILD_TYPE" --parallel "$(nproc)"

      - name: Run CI tests
        run: ctest --test-dir "$BUILD_DIR" --output-on-failure --timeout 60

      - name: Configure local module contracts
        run: |
          cmake \
            -S core/modules/tests/local \
            -B "$BUILD_DIR-local-contracts" \
            -DCMAKE_BUILD_TYPE="$BUILD_TYPE" \
            -DC2_BASE64_SOURCE_DIR="$GITHUB_WORKSPACE/thirdParty/base64" \
            -Dnlohmann_json_DIR="$GITHUB_WORKSPACE/$BUILD_DIR/conan/build/Release/generators" \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build local module contracts
        run: cmake --build "$BUILD_DIR-local-contracts" --parallel "$(nproc)"

      - name: Test local module contracts
        run: ctest --test-dir "$BUILD_DIR-local-contracts" --output-on-failure --timeout 60

      - name: Functional tests
        if: ${{ false }}
        run: echo "Functional tests require a lab/runtime environment and are intentionally skipped in standard CI."
